
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-pipeline-reader
  namespace: devops-app
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-pipeline-reader-binding
  namespace: devops-app
subjects:
  - kind: ServiceAccount
    name: jenkins-pipeline
    namespace: devops-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-pipeline-reader

