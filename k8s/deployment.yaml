
apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-devops-app

spec:
  replicas: 2

  selector:
   matchLabels:
      app: python-devops-app

  template:
    metadata:
      labels:
        app: python-devops-app

    spec:
      containers:
        - name: python-devops-app
          image: python-devops-app:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
